<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伴侣匹配</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        /* 流动渐变背景 */
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* 渐变配色 */
            background: linear-gradient(-45deg, #ff6b6b, #4ecdc4, #45b7d1, #ff9ff3);
            background-size: 400% 400%;
            animation: gradientFlow 12s ease infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 背景流动动画 */
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 输入框容器 */
        .box-wrap {
            text-align: center;
        }

        /* 输入框样式 */
        #nameInput {
            width: 500px;
            height: 60px;
            padding: 0 16px;
            font-size: 18px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            outline: none;
            text-align: center;
        }

        /* 输入框占位符 浅白色透明 */
        #nameInput::placeholder {
            color: rgba(255,255,255,0.4);
        }

        /* 隐藏元素 */
        .hidden {
            display: none;
        }

        /* 加载文字区域 */
        .loading-area {
            font-size: 28px;
            color: #ffffff;
            font-weight: 500;
        }

        /* 旋转加载点动画 */
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            margin: 0 4px;
            animation: dotRotate 1s infinite linear;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotRotate {
            0% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(-10px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.3; }
        }

        /* 结果文字 */
        .result-text {
            font-size: 48px;
            color: #fff;
            font-weight: bold;
        }

        /* 爱心样式 全屏漂浮 */
        .heart {
            position: absolute;
            color: #ff2d2d;
            font-size: 24px;
            pointer-events: none;
            animation: heartFloat 6s linear infinite;
        }

        @keyframes heartFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 输入区域 -->
    <div class="box-wrap" id="inputBox">
        <input type="text" id="nameInput" placeholder="请输入你的名字">
    </div>

    <!-- 加载区域 默认隐藏 -->
    <div class="loading-area hidden" id="loadingBox">
        正在匹配您的伴侣
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

    <!-- 匹配结果 默认隐藏 -->
    <div class="result-text hidden" id="resultBox">
        苟一仑
    </div>

    <script>
        const inputBox = document.getElementById('inputBox');
        const loadingBox = document.getElementById('loadingBox');
        const resultBox = document.getElementById('resultBox');
        const nameInput = document.getElementById('nameInput');

        // 输入框回车触发匹配
        nameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                startMatch();
            }
        });

        function startMatch() {
            // 隐藏输入框，显示加载动画
            inputBox.classList.add('hidden');
            loadingBox.classList.remove('hidden');

            // 2秒后显示结果，生成爱心
            setTimeout(() => {
                loadingBox.classList.add('hidden');
                resultBox.classList.remove('hidden');
                createHearts();
            }, 2000);
        }

        // 生成随机红色爱心铺满屏幕
        function createHearts() {
            // 一次性生成60个爱心
            for(let i = 0; i < 60; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '❤';
                // 随机位置、大小、动画时长
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = Math.random() * 20 + 16 + 'px';
                heart.style.animationDuration = Math.random() * 4 + 4 + 's';
                document.body.appendChild(heart);
            }
        }
    </script>
</body>
</html>
